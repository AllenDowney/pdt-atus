  Publisher: U.S. Bureau of Labor Statistics (BLS) (https://www.bls.gov/)

  Release `2003-2025`: ATUS 2003-2025 multi-year microdata files (current)

  Terms of use: https://www.bls.gov/opub/copyright-information.htm

  Citation: U.S. Bureau of Labor Statistics, American Time Use Survey, 2003-2025 multi-year microdata files, https://www.bls.gov/tus/data/datafiles-0325.htm.

  Exported by the PublicDataToolkit library 0.2.1 from this repository's records (`metadata/`), which are canonical and hold what data-dict can't: missing-code types, availability, wording by wave, corrections, provenance, groups and links. See LOSSES.md.
